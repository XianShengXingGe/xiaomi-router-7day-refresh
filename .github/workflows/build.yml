name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test and validate
        run: |
          make test
          make vet

      - name: Build release bundle
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-router-7day-refresh
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.sh
            dist/start.sh
            dist/status.sh
            dist/cleanup.sh
            dist/diagnose.sh
            dist/upgrade.sh
            dist/xiaomi-router-7day-refresh-linux-arm64
            dist/xiaomi-router-7day-refresh-linux-amd64
            dist/SHA256SUMS.txt
            dist/README.md
            dist/TEST_REPORT.txt
            dist/使用说明.txt
          generate_release_notes: true
